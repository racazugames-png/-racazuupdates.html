<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Updates</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
  }
  .update {
    background: white;
    border-radius: 10px;
    margin: 10px auto;
    padding: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    max-width: 600px;
  }
  .date {
    color: #666;
    font-size: 14px;
  }
  .content {
    margin-top: 5px;
    font-size: 16px;
  }
</style>
</head>
<body>
  <h1>📢 Site Updates</h1>
  <div id="updatesContainer">Loading updates...</div>

  <script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSjekBfRfylgk29uKefTpd2lUdB9GM9inPmmmHFJ4keNwQi0HQrtTqvY_mIzve4lCUo1oGEmEUPsvQX/pub?output=csv";

    fetch(sheetURL)
      .then(res => res.text())
      .then(csv => {
        const lines = csv.trim().split("\n").slice(1);
        const container = document.getElementById("updatesContainer");
        container.innerHTML = "";
        lines.reverse().forEach(line => {
          const [date, content] = line.split(/,(.+)/);
          const div = document.createElement("div");
          div.className = "update";
          div.innerHTML = `
            <div class="date">${date}</div>
            <div class="content">${content}</div>
          `;
          container.appendChild(div);
        });
      })
      .catch(() => {
        document.getElementById("updatesContainer").innerText = "Error loading updates.";
      });
  </script>
</body>
</html>
